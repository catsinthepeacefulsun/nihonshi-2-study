const D=Array.isArray(window.HISTORY_DATA)?window.HISTORY_DATA:[];
const $=s=>document.querySelector(s); let cat='すべて',masked=false,reviewOnly=false;
function loadState(){try{return JSON.parse(localStorage.getItem('historyMobileState')||localStorage.getItem('historyState')||'{}')||{}}catch(e){return {}}}
const state=loadState();
function save(){try{localStorage.setItem('historyMobileState',JSON.stringify(state))}catch(e){}}
function ec(e){e=String(e||'');return e.includes('古代')||/飛鳥|奈良|平安/.test(e)?'ancient':e.includes('中世')||/鎌倉|室町|南北朝|戦国/.test(e)?'medieval':e.includes('近世')||/江戸|安土|桃山|幕末/.test(e)?'earlymodern':e.includes('近代')||/明治|大正|昭和戦前/.test(e)?'modern':e.includes('現代')||/戦後|平成|令和|昭和戦後/.test(e)?'contemporary':''}
function esc(x){return String(x??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
function render(){
 const q=$('#q').value.trim().toLowerCase(),era=$('#era').value,st=$('#status').value;
 const a=D.filter(x=>(cat==='すべて'||x.category===cat)&&(!era||ec(x.era)===era)&&(!q||JSON.stringify(x).toLowerCase().includes(q))&&(!st||state[x.id]===st)&&(!reviewOnly||state[x.id]==='review'));
 $('#count').textContent=`${a.length} / ${D.length}項目`;
 $('#list').innerHTML=a.length?a.map(x=>`<article class="card ${masked?'masked':''}"><div class="cardhead ${ec(x.era)}"><div class="headrow"><div><h2>${esc(x.title)}</h2><div class="year">${esc(x.year)}</div></div><span class="era">${esc(x.era)}</span></div></div><div class="details">${Object.entries(x.details||{}).filter(([k])=>k!=='時代').map(([k,v])=>`<div class="row"><div class="label">${esc(k)}</div><div class="value">${esc(v)}</div></div>`).join('')}</div><div class="actions"><button class="known ${state[x.id]==='known'?'on':''}" onclick="setS(${x.id},'known')">✓ 覚えた</button><button class="review ${state[x.id]==='review'?'on':''}" onclick="setS(${x.id},'review')">↻ 要復習</button></div><div class="help">${masked?'答え部分を長押しすると一時的に確認できます。':''}</div></article>`).join(''):'<div class="empty">該当する項目はありません。</div>';
}
window.setS=(id,s)=>{state[id]=state[id]===s?'':s;save();render()};
function init(){
 $('#q').oninput=render; $('#era').onchange=render; $('#status').onchange=render;
 document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('on'));b.classList.add('on');cat=b.dataset.cat;render();window.scrollTo({top:0,behavior:'smooth'})});
 $('#mask').onclick=()=>{masked=!masked;$('#mask').textContent=masked?'暗記 ON':'暗記 OFF';render()};
 $('#reviewOnly').onclick=()=>{reviewOnly=!reviewOnly;$('#reviewOnly').textContent=reviewOnly?'全項目に戻る':'要復習だけ';render();window.scrollTo({top:0,behavior:'smooth'})};
 $('#topBtn').onclick=()=>window.scrollTo({top:0,behavior:'smooth'}); render();
}
try{init()}catch(e){$('#list').innerHTML='<div class="empty">読み込みエラーです。ページを再度開いてください。</div>'}
</script>
